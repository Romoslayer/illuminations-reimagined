plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
}

repositories {
    maven {
        name = 'TerraformersMC'
        url = uri('https://maven.terraformersmc.com/releases/')
        content { includeGroup 'com.terraformersmc' }
    }
    exclusiveContent {
        forRepository { maven { name = 'Modrinth'; url = uri('https://api.modrinth.com/maven') } }
        filter { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    minecraft("com.mojang:minecraft:${minecraft_version}")
    implementation("net.fabricmc:fabric-loader:${fabric_loader_version}")
    implementation("net.fabricmc.fabric-api:fabric-api:${fabric_version}")
    // Optional integration: shows the config button in Mod Menu. Not bundled; works without Mod Menu installed.
    compileOnly("com.terraformersmc:modmenu:${modmenu_version}") { transitive = false }

    // Compatibility testing only (never published): -Pcompat=sodium or -Pcompat=iris adds them to dev runs and game tests.
    def compat = providers.gradleProperty('compat').getOrElse('')
    if (compat == 'sodium' || compat == 'iris') {
        localRuntime("maven.modrinth:sodium:${sodium_version}")
    }
    if (compat == 'iris') {
        localRuntime("maven.modrinth:iris:${iris_version}")
    }
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.classtweaker")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        // Client-only mod: no server run configuration.
        remove server
    }
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'includeInternal', 'modCompileClasspath'].each { variant ->
    configurations.named(variant) {
        attributes {
            attribute(loaderAttribute, 'fabric')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant ->
        configurations.named(variant) {
            attributes {
                attribute(loaderAttribute, 'fabric')
            }
        }
    }
}

// Automated in-game tests: ./gradlew :fabric:runClientGameTest
// Launches the real client, creates a world and checks that every ambient effect spawns and cleans up correctly.
fabricApi {
    configureTests {
        createSourceSet = true
        modId = "${mod_id}_gametest"
        eula = true
        enableGameTests = false
        enableClientGameTests = true
    }
}

// ./gradlew :fabric:runClientGameTest -Psurvey also runs the terrain survey (real worldgen, default settings).
tasks.matching { it.name == 'runClientGameTest' }.configureEach {
    if (project.hasProperty('survey')) {
        systemProperty('illuminations_reimagined.survey', 'true')
        if (project.hasProperty('surveyStops')) {
            systemProperty('illuminations_reimagined.surveyStops', project.property('surveyStops').toString())
        }
    }
}

// ./gradlew :fabric:runClientGameTest -Pgallery captures 1920x1080 gallery screenshots into fabric/build/gallery.
tasks.matching { it.name == 'runClientGameTest' }.configureEach {
    if (project.hasProperty('spiritPreview')) {
        systemProperty('illuminations_reimagined.spiritPreview', 'true')
        systemProperty('illuminations_reimagined.galleryDir', layout.buildDirectory.dir('gallery').get().asFile.absolutePath)
    }
    if (project.hasProperty('gallery')) {
        systemProperty('illuminations_reimagined.gallery', 'true')
        systemProperty('illuminations_reimagined.galleryDir', layout.buildDirectory.dir('gallery').get().asFile.absolutePath)
        if (project.hasProperty('galleryShots')) {
            systemProperty('illuminations_reimagined.galleryShots', project.property('galleryShots').toString())
        }
    }
}

// ./gradlew :fabric:runClientGameTest -Pshowcase saves one screenshot of every effect to fabric/build/gallery/showcase.png.
tasks.matching { it.name == 'runClientGameTest' }.configureEach {
    if (project.hasProperty('showcase')) {
        systemProperty('illuminations_reimagined.showcase', 'true')
        systemProperty('illuminations_reimagined.galleryDir', layout.buildDirectory.dir('gallery').get().asFile.absolutePath)
    }
}

// ./gradlew :fabric:runClientGameTest -PfireflyShot saves firefly gallery shots to fabric/build/gallery/fireflies.
tasks.matching { it.name == 'runClientGameTest' }.configureEach {
    if (project.hasProperty('fireflyShot')) {
        systemProperty('illuminations_reimagined.fireflyShot', 'true')
        systemProperty('illuminations_reimagined.galleryDir', layout.buildDirectory.dir('gallery').get().asFile.absolutePath)
    }
}

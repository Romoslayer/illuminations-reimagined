plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

// Dev-only visual check (never in the release jar): -PspiritPreview with -PquickPlayWorld screenshots the spirits.
sourceSets {
    devpreview {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

neoForge {
    version = neoforge_version
    // Automatically enable NeoForge AccessTransformers if the file exists
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    runs {
        configureEach {
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})"
        }
        client {
            client()
            gameDirectory = this.mkdir(this.file('runs/client'))
            // Optional: -PquickPlayWorld=<save name> joins that singleplayer world straight away (smoke testing).
            if (project.hasProperty('quickPlayWorld')) {
                programArguments.addAll('--quickPlaySingleplayer', project.property('quickPlayWorld').toString())
                systemProperty('illuminations_reimagined.debugCounts', 'true')
            }
            if (project.hasProperty('spiritPreview')) {
                programArguments.addAll('--width', '1920', '--height', '1080')
                systemProperty('illuminations_reimagined.spiritPreview', 'true')
                systemProperty('illuminations_reimagined.galleryDir', layout.buildDirectory.dir('gallery').get().asFile.absolutePath)
            }
        }
        // Client-only mod: no server or data runs.
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            if (project.hasProperty('spiritPreview')) {
                sourceSet sourceSets.devpreview
            }
        }
    }
}
neoForge.addModdingDependenciesTo(sourceSets.devpreview)

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements'].each { variant ->
    configurations.named(variant) {
        attributes {
            attribute(loaderAttribute, 'neoforge')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName, it.getTaskName(null, 'jarJar')].each { variant ->
        configurations.named(variant) {
            attributes {
                attribute(loaderAttribute, 'neoforge')
            }
        }
    }
}

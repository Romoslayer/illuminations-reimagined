modLoader = "javafml"
loaderVersion = "${neoforge_loader_version_range}"
license = "${license}"
issueTrackerURL = "https://github.com/Romoslayer/illuminations-reimagined/issues"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
displayURL = "https://github.com/Romoslayer/illuminations-reimagined"
iconFile = "assets/${mod_id}/icon.png"
credits = "${credits}"
authors = "${mod_author}"
description = '''${description}'''

[[mixins]]
config = "${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_version},)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "CLIENT"

# The original mod is a different, unrelated project; running both would double every effect.
[[dependencies.${mod_id}]]
modId = "illuminations"
type = "incompatible"
reason = "Illuminations Reimagined replaces the original Illuminations; install only one."
versionRange = "*"
ordering = "NONE"
side = "CLIENT"

# Version-specific values (Minecraft, Fabric, NeoForge) live in versions/<mc>.properties.
# Build a specific Minecraft version with: ./gradlew build -Pmc=26.2
# Every field used in resource templates must be added to the expandProps map in
# build-logic/src/main/groovy/multiloader-common.gradle.

# Project
mod_version=0.1.2
group=io.github.illuminationsreimagined
java_version=25

# Mod metadata
mod_name=Illuminations Reimagined
mod_author=Romoslayer
mod_id=illuminations_reimagined
license=GPL-3.0-or-later
credits=Unofficial continuation of Illuminations by doctor4t / Ladysnake (https://github.com/Ladysnake/Illuminations). Not affiliated with or endorsed by Ladysnake.
description=Unofficial continuation of Illuminations: fireflies, glowworms, plankton and other ambient lights for dark places. Client-side only. Not affiliated with or endorsed by Ladysnake.

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
# ForgeGradle dev runs need classes and resources in one folder.
net.minecraftforge.gradle.merge-source-sets=true
